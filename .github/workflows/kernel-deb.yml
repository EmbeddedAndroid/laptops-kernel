name: kernel-deb

# Cross-builds the arm64 kernel as Debian packages via the local
# build-linux-deb composite action, which drives
# qualcomm-linux/qcom-deb-images build-linux-deb.py (defconfig + all
# kernel-configs/*.config fragments + bindeb-pkg).
#
# Runner is allocated on demand by the cil-gha-bridge: the runs-on
# labels map to the bridge's "generic" profile on the x86_64 xeon pool
# (16 vCPU / 32 GB RAM / 100 GB disk).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Needed for the release step to create the tag + release and upload assets.
permissions:
  contents: write

jobs:
  build-arm64-deb:
    # [self-hosted, cil] -> cil-gha-bridge; "16c-32g-100g" is the
    # generic-profile shape token (cpu-ram-disk). One ephemeral CIL
    # lease per run; torn down on completion.
    runs-on: [self-hosted, cil, 16c-32g-100g]
    timeout-minutes: 120
    env:
      KBUILD_BUILD_USER: cil-ci
      KBUILD_BUILD_HOST: cil-gha-bridge

    steps:
      # Minimal checkout: just enough to resolve the local composite
      # action. The kernel source itself is cloned by the action's build
      # script. Partial + sparse so we don't pull the whole tree twice.
      - name: Checkout workflow repo (for local action)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          filter: blob:none
          fetch-depth: 1

      - name: Build arm64 kernel Debian packages
        id: build
        uses: ./.github/actions/build-linux-deb
        with:
          kernel-repo: ${{ github.server_url }}/${{ github.repository }}
          kernel-ref: ${{ github.head_ref || github.ref_name }}

      - name: Upload Debian packages (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: |
            ${{ steps.build.outputs.deb-dir }}/*.deb
            ${{ steps.build.outputs.deb-dir }}/config-*
            ${{ steps.build.outputs.deb-dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        # Any branch push (skip PRs); auto-tags each build and attaches
        # the .deb packages plus the kernel config.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Linux ${{ steps.build.outputs.kernelversion }} arm64 — ${{ github.ref_name }} (build ${{ github.run_number }})
          body: |
            arm64 Debian packages, cross-compiled on amd64 via
            qcom-deb-images build-linux-deb.py.

            Config: arm64 `defconfig` + all `kernel-configs/*.config`
            fragments from qualcomm-linux/qcom-deb-images. The exact built
            `.config` is attached as `config-*`.

            - Kernel version: `${{ steps.build.outputs.kernelversion }}`
            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - CI run: ${{ github.run_number }}

            SHA256 sums are in `SHA256SUMS`.
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.build.outputs.deb-dir }}/*.deb
            ${{ steps.build.outputs.deb-dir }}/config-*
            ${{ steps.build.outputs.deb-dir }}/SHA256SUMS
          fail_on_unmatched_files: true
